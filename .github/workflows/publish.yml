name: Publish bowenwang.me

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
    steps:
      - name: Read website source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BowenBryanWang/BowenBryanWang.github.io
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check deployed revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          revision=$(git rev-parse HEAD)
          deployed=$(curl --fail --silent --show-error --max-time 15 https://bowenwang.me/published-source.json | jq -r .revision || true)
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ "$revision" = "$deployed" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.revision.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Build website
        if: steps.revision.outputs.changed == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SOURCE_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          printf '%s\n' bowenwang.me > out/CNAME
          touch out/.nojekyll
          jq -n --arg revision "$SOURCE_REVISION" '{revision: $revision}' > out/published-source.json
          test -s out/index.html
          test -s out/blog/on-policy-merge.html
          test -s out/sitemap.xml

      - name: Upload published files
        if: steps.revision.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 600000
